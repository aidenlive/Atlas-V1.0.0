name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  standard:
    name: atlas compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install atlas-standard
      - name: compliance gates
        run: atlas check
      - name: dashboard and index are current
        run: atlas work sync --check
