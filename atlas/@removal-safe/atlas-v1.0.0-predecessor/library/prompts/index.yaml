# library/prompts/index.yaml — machine-readable catalog; tests keep it in sync with files
standard: library/1.0
categories:
- name: workspace
  description: 'Operating the WORKSPACE standard: capture, filing, archiving, integrity.'
  prompts:
  - id: audit-workspace
    file: workspace/request-audit-workspace.txt
    objective: Audit this workspace against spec/workspace
  - id: scaffold-workspace
    file: workspace/request-scaffold-workspace.txt
    objective: Create the canonical WORKSPACE tree (00_inbox through 05_archive plus code/, notes/, assets/,
      scripts/) idempo
  - id: drain-inbox
    file: workspace/request-drain-inbox.txt
    objective: Triage everything in 00_inbox
  - id: archive-project-folder
    file: workspace/request-archive-project-folder.txt
    objective: Run the archive ceremony for the named project folder
  - id: plan-workspace-migration
    file: workspace/request-plan-workspace-migration.txt
    objective: Plan a migration of my current file mess into WORKSPACE using the four bounded passes (scaffold,
      declare bankr
  - id: verify-archive-integrity
    file: workspace/request-verify-archive-integrity.txt
    objective: Re-verify every SHA256SUMS manifest in 05_archive/ and report checksum mismatches, unmanifested
      folders, and a
- name: repository
  description: 'Bringing a repository to PROJECT.md compliance: root, manifest, truth consolidation.'
  prompts:
  - id: initialize-project
    file: repository/request-initialize-project.txt
    objective: Initialize this repository to atlas compliance
  - id: classify-project
    file: repository/request-classify-project.txt
    objective: Classify this project honestly along the eight Matrix dimensions in spec/project-matrix
  - id: adopt-standard
    file: repository/request-adopt-standard.txt
    objective: Run the four-pass adoption from docs/guides/adoption
  - id: write-agents-guide
    file: repository/request-write-agents-guide.txt
    objective: Write or update AGENTS
  - id: consolidate-truth
    file: repository/request-consolidate-truth.txt
    objective: Find every fact stated in more than one place in this repository (setup steps, ownership,
      versions, convention
  - id: close-root
    file: repository/request-close-root.txt
    objective: Enforce the closed root set
- name: architecture
  description: Designing, recording, and reviewing system structure.
  prompts:
  - id: document-architecture
    file: architecture/request-document-architecture.txt
    objective: Write docs/architecture/ for this system
  - id: record-decision
    file: architecture/request-record-decision.txt
    objective: Record the decision we just made as the next numbered ADR in docs/decisions/ (context,
      decision, consequences)
  - id: draw-system-diagram
    file: architecture/request-draw-system-diagram.txt
    objective: Produce an architecture diagram of this repository or system as a hand-editable SVG or
      Mermaid file under docs
  - id: review-architecture
    file: architecture/request-review-architecture.txt
    objective: Review the current architecture against its documentation
  - id: threat-model
    file: architecture/request-threat-model.txt
    objective: Write the one-page threat model sketch required by checklist item SEC-06
- name: documentation
  description: Keeping prose truthful, single-sourced, and structured per docs/ conventions.
  prompts:
  - id: audit-documentation
    file: documentation/request-audit-documentation.txt
    objective: Audit all documentation for drift
  - id: write-readme
    file: documentation/request-write-readme.txt
    objective: Write or rebuild README
  - id: update-changelog
    file: documentation/request-update-changelog.txt
    objective: Update CHANGELOG
  - id: write-guide
    file: documentation/request-write-guide.txt
    objective: Write a task-oriented guide in docs/guides/ for the named workflow
  - id: generate-reference
    file: documentation/request-generate-reference.txt
    objective: Generate or refresh docs/reference/ for this project's public surface (API, CLI, or config)
      from the source of
- name: github
  description: Forge configuration as declared, reviewable state.
  prompts:
  - id: configure-forge-metadata
    file: github/request-configure-forge-metadata.txt
    objective: Set this repository's forge metadata from project
  - id: setup-branch-protection
    file: github/request-setup-branch-protection.txt
