    file: releases/request-cut-release.txt
    objective: Execute the release ceremony
  - id: write-release-notes
    file: releases/request-write-release-notes.txt
    objective: Write release notes for the new version derived from CHANGELOG
  - id: verify-release
    file: releases/request-verify-release.txt
    objective: Verify the just-published release as a consumer would
  - id: plan-breaking-change
    file: releases/request-plan-breaking-change.txt
    objective: Plan the proposed breaking change per gate QG-04
