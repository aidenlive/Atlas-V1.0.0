- name: security
  description: Scanning, credentials, disclosure, and response.
  prompts:
  - id: security-audit
    file: security/request-security-audit.txt
    objective: Audit this repository against the SEC checklist items
  - id: scan-dependencies
    file: security/request-scan-dependencies.txt
    objective: Run dependency vulnerability and license scanning, waiver-check any known-critical findings,
      and verify the au
  - id: rotate-credentials
    file: security/request-rotate-credentials.txt
