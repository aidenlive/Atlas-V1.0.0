    objective: Survey every project
  - id: deprecate-project
    file: maintenance/request-deprecate-project.txt
    objective: Execute the deprecation gate for this project
  - id: archive-repository
    file: maintenance/request-archive-repository.txt
    objective: Execute the archival gate
  - id: revive-project
    file: maintenance/request-revive-project.txt
    objective: Revive the named maintenance-mode or archived work as an explicit event
  - id: remove-dead-code
    file: maintenance/request-remove-dead-code.txt
    objective: Find code that is unreachable, unimported, or feature-flagged off permanently, and delete
      it in one well-label
  - id: renew-assets
    file: maintenance/request-renew-assets.txt
    objective: "Inventory every expiring asset this project depends on \u2014 domains, certificates, licenses,\
      \ vendor contracts, to"
- name: design
  description: Visual identity and README composition per PRESENTATION.
  prompts:
  - id: apply-brand
    file: design/request-apply-brand.txt
    objective: Apply the fleet visual identity to this repository
  - id: create-banner
    file: design/request-create-banner.txt
    objective: Create a hero banner for this project as a hand-authored SVG in assets/ following the fleet
      geometry
  - id: compose-readme-visuals
    file: design/request-compose-readme-visuals.txt
    objective: Rework the README's first screen to the P-06 composition
  - id: audit-presentation
    file: design/request-audit-presentation.txt
    objective: Audit this repository against PRESENTATION items PR-01
- name: agents
  description: Operating AI agents as governed principals.
  prompts:
  - id: onboard-agent
    file: agents/request-onboard-agent.txt
    objective: Onboard yourself to this repository by reading AGENTS
  - id: define-agent-constraints
    file: agents/request-define-agent-constraints.txt
    objective: Write or tighten the Constraints section of AGENTS
  - id: verify-agent-compliance
    file: agents/request-verify-agent-compliance.txt
    objective: Review the recent agent-authored changes in this repository against AGENTS
  - id: delegate-task
    file: agents/request-delegate-task.txt
    objective: Turn the following goal into a well-posed agent task
  - id: review-agent-output
    file: agents/request-review-agent-output.txt
    objective: Review this agent-produced change as a maintainer would
- name: workstreams
