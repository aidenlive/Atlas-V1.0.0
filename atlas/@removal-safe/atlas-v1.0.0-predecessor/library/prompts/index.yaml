    file: quality/request-raise-maturity.txt
    objective: Plan the promotion of this project to the next maturity level
  - id: add-tests
    file: quality/request-add-tests.txt
    objective: "Add automated tests covering the quickstart path and every documented public behavior\
      \ \u2014 the docs are the test "
  - id: fix-coverage-ratchet
    file: quality/request-fix-coverage-ratchet.txt
    objective: Configure coverage measurement with a ratchet (coverage may not decrease) rather than a
