    objective: Open a new workstream for the named initiative
  - id: plan-workstream
    file: workstreams/request-plan-workstream.txt
    objective: Draft this workstream's plan and milestones
  - id: update-workstream-status
    file: workstreams/request-update-workstream-status.txt
    objective: Reconcile this workstream with reality
  - id: assign-agents
    file: workstreams/request-assign-agents.txt
    objective: Write the agent assignments for this workstream
  - id: write-handoff
    file: workstreams/request-write-handoff.txt
    objective: Write the handoff for the work just completed
  - id: verify-workstream
    file: workstreams/request-verify-workstream.txt
    objective: Verify this workstream against its own acceptance criteria
  - id: close-workstream
    file: workstreams/request-close-workstream.txt
