- name: operations
  description: 'Running services: runbooks, observability, failure practice.'
  prompts:
  - id: write-runbook
    file: operations/request-write-runbook.txt
    objective: Write ops/runbook
  - id: setup-observability
    file: operations/request-setup-observability.txt
    objective: Wire structured logging, golden-signal metrics, and alerts routed to the owning duty holders
      for this deployme
  - id: exercise-rollback
    file: operations/request-exercise-rollback.txt
    objective: Exercise the rollback procedure for this service in a safe environment, record the actual
      time and steps taken
  - id: test-restore
    file: operations/request-test-restore.txt
    objective: Perform a full backup restore test for this stateful service
  - id: handle-incident
    file: operations/request-handle-incident.txt
    objective: Coordinate the active incident per the runbook
  - id: write-postmortem
    file: operations/request-write-postmortem.txt
    objective: Write the blameless postmortem for the named incident
