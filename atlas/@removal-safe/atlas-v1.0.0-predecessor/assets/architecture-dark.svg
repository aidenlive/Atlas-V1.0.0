<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-label="atlas architecture: specifications and work Markdown in the source column feed generated schemas and indexes in the machine-readable column, which validate.py, work.py, check-compliance.sh and sync-template.py enforce in the third column on every pull request">
<rect width="1120" height="620" fill="#0f0f0f"/>
<g font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace">
<text x="48" y="38" font-size="11" fill="#767676" letter-spacing="2">SOURCE</text>
<text x="420" y="38" font-size="11" fill="#767676" letter-spacing="2">MACHINE-READABLE</text>
<text x="792" y="38" font-size="11" fill="#767676" letter-spacing="2">ENFORCEMENT</text>
<path d="M48 52H1072" stroke="#2a2a2a" stroke-width="1"/>
<rect x="48" y="76" width="300" height="104" fill="#161616" stroke="#3d3d3d" stroke-width="1"/><text x="62" y="105.0" font-size="14" font-weight="500" fill="#f4f4f4">spec/*.md</text><text x="62" y="129.0" font-size="12" fill="#a8a8a8">Eight standards. Prose is</text><text x="62" y="147.0" font-size="12" fill="#a8a8a8">normative. Front matter is</text><text x="62" y="165.0" font-size="12" fill="#a8a8a8">machine-discoverable.</text>
<rect x="420" y="76" width="300" height="104" fill="#161616" stroke="#3d3d3d" stroke-width="1"/><text x="434" y="105.0" font-size="14" font-weight="500" fill="#f4f4f4">spec/schemas/*.json</text><text x="434" y="129.0" font-size="12" fill="#a8a8a8">Encode the enums the prose</text><text x="434" y="147.0" font-size="12" fill="#a8a8a8">states. Consistency tests</text><text x="434" y="165.0" font-size="12" fill="#a8a8a8">couple the two.</text>
<rect x="792" y="76" width="280" height="104" fill="#161616" stroke="#3d3d3d" stroke-width="1"/><text x="806" y="105.0" font-size="14" font-weight="500" fill="#f4f4f4">atlas validate</text><text x="806" y="129.0" font-size="12" fill="#a8a8a8">Every manifest against the</text><text x="806" y="147.0" font-size="12" fill="#a8a8a8">schema its standard: field</text><text x="806" y="165.0" font-size="12" fill="#a8a8a8">names.</text>
<path d="M348 128.0H412" stroke="#3d3d3d" stroke-width="1"/><path d="M412 124.0L420 128.0L412 132.0" fill="none" stroke="#767676" stroke-width="1" stroke-linejoin="round"/><text x="384.0" y="118.0" font-size="11" fill="#767676" text-anchor="middle" letter-spacing="0.5">encodes</text>
<path d="M720 128.0H784" stroke="#3d3d3d" stroke-width="1"/><path d="M784 124.0L792 128.0L784 132.0" fill="none" stroke="#767676" stroke-width="1" stroke-linejoin="round"/><text x="756.0" y="118.0" font-size="11" fill="#767676" text-anchor="middle" letter-spacing="0.5">validates</text>
<rect x="48" y="204" width="300" height="104" fill="#161616" stroke="#3d3d3d" stroke-width="1"/><text x="62" y="242.0" font-size="14" font-weight="500" fill="#f4f4f4">work/NN_slug/*.md</text><text x="62" y="266.0" font-size="12" fill="#a8a8a8">Nine numbered sections.</text><text x="62" y="284.0" font-size="12" fill="#a8a8a8">Markdown is canonical.</text>
<rect x="420" y="204" width="300" height="104" fill="#161616" stroke="#3d3d3d" stroke-width="1"/><text x="434" y="242.0" font-size="14" font-weight="500" fill="#f4f4f4">work/index.yaml</text><text x="434" y="266.0" font-size="12" fill="#a8a8a8">Generated. Progress is</text><text x="434" y="284.0" font-size="12" fill="#a8a8a8">counted, never asserted.</text>
<rect x="792" y="204" width="280" height="104" fill="#161616" stroke="#3d3d3d" stroke-width="1"/><text x="806" y="242.0" font-size="14" font-weight="500" fill="#f4f4f4">atlas work validate</text><text x="806" y="266.0" font-size="12" fill="#a8a8a8">Skeleton, graph, and</text><text x="806" y="284.0" font-size="12" fill="#a8a8a8">evidence before done.</text>
<path d="M348 256.0H412" stroke="#3d3d3d" stroke-width="1"/><path d="M412 252.0L420 256.0L412 260.0" fill="none" stroke="#767676" stroke-width="1" stroke-linejoin="round"/><text x="384.0" y="246.0" font-size="11" fill="#767676" text-anchor="middle" letter-spacing="0.5">syncs</text>
<path d="M720 256.0H784" stroke="#3d3d3d" stroke-width="1"/><path d="M784 252.0L792 256.0L784 260.0" fill="none" stroke="#767676" stroke-width="1" stroke-linejoin="round"/><text x="756.0" y="246.0" font-size="11" fill="#767676" text-anchor="middle" letter-spacing="0.5">checks</text>
<rect x="48" y="332" width="300" height="104" fill="#161616" stroke="#3d3d3d" stroke-width="1"/><text x="62" y="370.0" font-size="14" font-weight="500" fill="#f4f4f4">library/prompts/*.txt</text><text x="62" y="394.0" font-size="12" fill="#a8a8a8">Reusable intent, one</text><text x="62" y="412.0" font-size="12" fill="#a8a8a8">objective each.</text>
<rect x="420" y="332" width="300" height="104" fill="#161616" stroke="#3d3d3d" stroke-width="1"/><text x="434" y="370.0" font-size="14" font-weight="500" fill="#f4f4f4">library/prompts/index.yaml</text><text x="434" y="394.0" font-size="12" fill="#a8a8a8">Generated catalog,</text><text x="434" y="412.0" font-size="12" fill="#a8a8a8">14 categories.</text>
<rect x="792" y="332" width="280" height="104" fill="#161616" stroke="#3d3d3d" stroke-width="1"/><text x="806" y="370.0" font-size="14" font-weight="500" fill="#f4f4f4">atlas library check</text><text x="806" y="394.0" font-size="12" fill="#a8a8a8">Index and files agree</text><text x="806" y="412.0" font-size="12" fill="#a8a8a8">in both directions.</text>
<path d="M348 384.0H412" stroke="#3d3d3d" stroke-width="1"/><path d="M412 380.0L420 384.0L412 388.0" fill="none" stroke="#767676" stroke-width="1" stroke-linejoin="round"/><text x="384.0" y="374.0" font-size="11" fill="#767676" text-anchor="middle" letter-spacing="0.5">emits</text>
<path d="M720 384.0H784" stroke="#3d3d3d" stroke-width="1"/><path d="M784 380.0L792 384.0L784 388.0" fill="none" stroke="#767676" stroke-width="1" stroke-linejoin="round"/><text x="756.0" y="374.0" font-size="11" fill="#767676" text-anchor="middle" letter-spacing="0.5">contracts</text>
<rect x="48" y="460" width="300" height="104" fill="#161616" stroke="#3d3d3d" stroke-width="1"/><text x="62" y="498.0" font-size="14" font-weight="500" fill="#f4f4f4">work/_template</text><text x="62" y="522.0" font-size="12" fill="#a8a8a8">The canonical work system,</text><text x="62" y="540.0" font-size="12" fill="#a8a8a8">authored once.</text>
<rect x="420" y="460" width="300" height="104" fill="#161616" stroke="#3d3d3d" stroke-width="1"/><text x="434" y="498.0" font-size="14" font-weight="500" fill="#f4f4f4">template/</text><text x="434" y="522.0" font-size="12" fill="#a8a8a8">The scaffold consumers</text><text x="434" y="540.0" font-size="12" fill="#a8a8a8">copy out.</text>
<rect x="792" y="460" width="280" height="104" fill="#161616" stroke="#3d3d3d" stroke-width="1"/><text x="806" y="507.0" font-size="14" font-weight="500" fill="#f4f4f4">atlas template check</text><text x="806" y="531.0" font-size="12" fill="#a8a8a8">Mirror cannot drift.</text>
<path d="M348 512.0H412" stroke="#3d3d3d" stroke-width="1"/><path d="M412 508.0L420 512.0L412 516.0" fill="none" stroke="#767676" stroke-width="1" stroke-linejoin="round"/><text x="384.0" y="502.0" font-size="11" fill="#767676" text-anchor="middle" letter-spacing="0.5">mirrors</text>
<path d="M720 512.0H784" stroke="#3d3d3d" stroke-width="1"/><path d="M784 508.0L792 512.0L784 516.0" fill="none" stroke="#767676" stroke-width="1" stroke-linejoin="round"/><text x="756.0" y="502.0" font-size="11" fill="#767676" text-anchor="middle" letter-spacing="0.5">verifies</text>
<path d="M48 590.5H1072" stroke="#2a2a2a" stroke-width="1"/>
<text x="48" y="612" font-size="11" fill="#767676" letter-spacing="2">CI RUNS EVERY COLUMN ON EVERY PULL REQUEST</text>
<text x="1072" y="612" font-size="11" fill="#767676" text-anchor="end" letter-spacing="2">MARKDOWN IS CANONICAL</text>
</g></svg>