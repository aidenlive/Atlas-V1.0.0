# The lexicon: how this repository spells its names, and which habits it has
# decided against. `atlas lint` reads this file, so a change here is enforced
# everywhere on the next run.
standard: editorial/1.0
version: "0.1"
updated: "{{DATE}}"
owner: "{{OWNER}}"

terms:
  - id: "{{NAME}}"
    use: "{{TITLE}}"
    avoid: []
    kind: product
    severity: error
    note: "Replace with the real names this repository writes about."

phrases:
  - {avoid: utilize, use: use, reason: "shorter word, same meaning"}
  - {avoid: in order to, use: to, reason: "the extra words carry nothing"}
  - {avoid: it is important to note that, use: "nothing — delete it and state the fact", reason: "if it were not important it would not be here"}
